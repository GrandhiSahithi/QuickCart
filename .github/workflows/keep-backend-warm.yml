name: Keep backend warm

# Render's free tier puts the backend to sleep after ~15 minutes with no
# requests, and the next request pays a 20-60s cold-start penalty - which
# looks exactly like "the site is broken" to anyone using it right then.
# Ping the health endpoint often enough that it never gets the chance to
# sleep.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          curl -sS -o /dev/null -w "status: %{http_code}, time: %{time_total}s\n" \
            --max-time 90 \
            https://quickcart-7964.onrender.com/api/health
