spring.application.name=quickcart-backend
# Render (and most hosts) inject PORT at runtime; falls back to 8080 locally.
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/quickcart}
spring.datasource.username=${DB_USERNAME:quickcart}
spring.datasource.password=${DB_PASSWORD:quickcart123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Demo-only defaults - override with real env vars before deploying anywhere.
jwt.secret=${JWT_SECRET:quickcart-dev-secret-please-override-in-prod-0123456789}
admin.seed.email=${ADMIN_EMAIL:admin@quickcart.com}
admin.seed.password=${ADMIN_PASSWORD:Admin123!Quick}
